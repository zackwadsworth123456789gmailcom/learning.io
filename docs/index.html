    <script>
      (function() {
        var host = window.location.hostname;
        var path = window.location.pathname;

        // SPA 404 redirect decoder for GitHub Pages
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&'); 
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }

        // Add trailing slash to repository root if missing (prevents relative path 404s)
        if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-NR0tZulE.js"></script>

    <noscript>
      <div style="font-family: sans-serif; padding: 2rem; text-align: center; color: #e4e4e7; background: #09090b; height: 100vh;">
        <h2>JavaScript Required</h2>
        <p>Please enable JavaScript in your browser to run Arcade.io Unblocked Games.</p>

    <div id="root">
      <div id="initial-loading" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #09090b; color: #a1a1aa; font-family: ui-sans-serif, system-ui, sans-serif;">
        <div style="width: 36px; height: 36px; border: 3px solid #27272a; border-top-color: #6366f1; border-radius: 50%; animation: arcade-spin 0.8s linear infinite;"></div>
        <p style="margin-top: 14px; font-size: 13px; font-weight: 600; color: #d4d4d8; letter-spacing: 0.05em;">LOADING ARCADE.IO...</p>
        <p id="boot-status" style="margin-top: 6px; font-size: 11px; font-family: ui-monospace, monospace; color: #71717a;">Initializing games</p>
        <style>@keyframes arcade-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var status = document.getElementById('boot-status');
        if (status) {
          status.innerHTML = '<span style="color: #f87171;">Failed to load bundle: ' + (e.message || 'Script error') + '</span><br/><a href="./" style="display:inline-block; margin-top:8px; padding:4px 10px; background:#4f46e5; color:#fff; border-radius:4px; text-decoration:none; font-size:11px;">Reload Page</a>';
        }
      });
      // If deployed on GitHub Pages with root deployment (unbundled source), forward to /docs/
      if (window.location.hostname.includes('github.io') && !window.location.pathname.includes('/docs/')) {
        var rawScript = document.querySelector('script[src*="main.jsx"]');
        if (rawScript) {
          var target = window.location.pathname.replace(/\/?$/, '/docs/');
          window.location.replace(target + window.location.search + window.location.hash);
        }
      }
    </script>
