<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 480px;
      padding: 12px 16px;
      background: #111827;
      border-radius: 12px 12px 0 0;
      border: 1px solid #1f2937;
      border-bottom: none;
    }
    .scores {
      display: flex;
      gap: 20px;
      font-weight: 700;
      font-size: 15px;
    }
    .score-val { color: #10b981; }
    .best-val { color: #f59e0b; }
    #canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1;
      background: #030712;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .btn {
      background: #10b981;
      color: #064e3b;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      margin-top: 16px;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #34d399; transform: translateY(-1px); }
    .controls-hint {
      margin-top: 12px;
      font-size: 13px;
      color: #94a3b8;
    }
    .mobile-pad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-gap: 8px;
      margin-top: 12px;
    }
    .pad-btn {
      width: 56px;
      height: 48px;
      background: #1f2937;
      color: #e2e8f0;
      border: 1px solid #374151;
      border-radius: 8px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .pad-btn:active { background: #374151; }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px;">
      <span>🐍</span> <span>Retro Snake</span>
    </div>
    <div class="scores">
      <div>Score: <span id="score" class="score-val">0</span></div>
      <div>High: <span id="high" class="best-val">0</span></div>
    </div>
  </div>
  <div id="canvas-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title" style="font-size: 26px; margin-bottom: 8px;">Snake Arcade</h2>
      <p id="overlay-msg" style="color: #94a3b8; font-size: 14px;">Use Arrow keys or WASD to navigate</p>
      <button class="btn" id="start-btn">Start Game</button>
    </div>
  </div>

  <div class="controls-hint">Desktop: Arrow Keys / WASD • Mobile: On-screen pad</div>

  <div class="mobile-pad">
    <div></div>
    <button class="pad-btn" id="btn-up">▲</button>
    <div></div>
    <button class="pad-btn" id="btn-left">◀</button>
    <button class="pad-btn" id="btn-down">▼</button>
    <button class="pad-btn" id="btn-right">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    const GRID = 20;
    const TILE = canvas.width / GRID;

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 10, y: 10 };
    let score = 0;
    let high = localStorage.getItem('snake_high') || 0;
    highEl.textContent = high;
    let gameLoop = null;
    let running = false;
    let particles = [];

    // Audio synthesizer
    let audioCtx = null;
    function playBeep(freq, type = 'sine', duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
        valid = !snake.some(s => s.x === food.x && s.y === food.y);
      }
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: (x + 0.5) * TILE,
          y: (y + 0.5) * TILE,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 1,
          color: color
        });
      }
    }

    function resetGame() {
      snake = [
        { x: 5, y: 10 },
        { x: 4, y: 10 },
        { x: 3, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = score;
      particles = [];
      spawnFood();
      running = true;
      overlay.style.display = 'none';
      clearInterval(gameLoop);
      gameLoop = setInterval(update, 110);
    }

    function gameOver() {
      running = false;
      clearInterval(gameLoop);
      playBeep(140, 'sawtooth', 0.25);
      if (score > high) {
        high = score;
        localStorage.setItem('snake_high', high);
        highEl.textContent = high;
      }
      overlayTitle.textContent = 'Game Over';
      overlayMsg.textContent = `Score: ${score} | High: ${high}`;
      startBtn.textContent = 'Play Again';
      overlay.style.display = 'flex';
    }

    function update() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        return gameOver();
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        playBeep(520, 'sine', 0.1);
        createParticles(food.x, food.y, '#10b981');
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid background
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * TILE, 0);
        ctx.lineTo(i * TILE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * TILE);
        ctx.lineTo(canvas.width, i * TILE);
        ctx.stroke();
      }

      // Draw food
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * TILE, (food.y + 0.5) * TILE, TILE * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw snake
      snake.forEach((s, idx) => {
        if (idx === 0) {
          ctx.fillStyle = '#10b981';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 6;
        } else {
          ctx.fillStyle = '#059669';
          ctx.shadowBlur = 0;
        }
        ctx.beginPath();
        ctx.roundRect(s.x * TILE + 1, s.y * TILE + 1, TILE - 2, TILE - 2, 4);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Draw particles
      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) {
          particles.splice(idx, 1);
        } else {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      });
    }

    // Keyboard listener
    window.addEventListener('keydown', e => {
      if (!running && (e.code === 'Space' || e.code === 'Enter')) {
        resetGame();
        return;
      }
      if (['ArrowUp', 'KeyW'].includes(e.code) && dir.y === 0) nextDir = { x: 0, y: -1 };
      else if (['ArrowDown', 'KeyS'].includes(e.code) && dir.y === 0) nextDir = { x: 0, y: 1 };
      else if (['ArrowLeft', 'KeyA'].includes(e.code) && dir.x === 0) nextDir = { x: -1, y: 0 };
      else if (['ArrowRight', 'KeyD'].includes(e.code) && dir.x === 0) nextDir = { x: 1, y: 0 };
    });

    startBtn.addEventListener('click', resetGame);

    document.getElementById('btn-up').onclick = () => { if (dir.y === 0) nextDir = { x: 0, y: -1 }; };
    document.getElementById('btn-down').onclick = () => { if (dir.y === 0) nextDir = { x: 0, y: 1 }; };
    document.getElementById('btn-left').onclick = () => { if (dir.x === 0) nextDir = { x: -1, y: 0 }; };
    document.getElementById('btn-right').onclick = () => { if (dir.x === 0) nextDir = { x: 1, y: 0 }; };

    draw();
  </script>
</body>
</html>
