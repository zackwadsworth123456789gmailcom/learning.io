<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #wrap {
      position: relative;
      width: 100%;
      max-width: 520px;
      border: 2px solid #334155;
      background: #000;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      padding: 12px;
      background: #0f172a;
      font-size: 20px;
      font-weight: bold;
    }
    canvas {
      display: block;
      width: 100%;
    }
    .overlay {
      position: absolute;
      inset: 0;
      top: 50px;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .mode-select {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .btn {
      background: #38bdf8;
      color: #082f49;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      padding: 10px 18px;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="hud">
      <div>PLAYER 1: <span id="p1-score" style="color: #38bdf8;">0</span></div>
      <div>PLAYER 2 / AI: <span id="p2-score" style="color: #f43f5e;">0</span></div>
    </div>
    <canvas id="canvas" width="520" height="340"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="over-title" style="font-size: 26px; margin-bottom: 8px;">RETRO PONG</h1>
      <p id="over-desc" style="color: #94a3b8; font-size: 13px;">First to 7 points wins!</p>
      <div class="mode-select">
        <button class="btn" id="btn-1p">1 Player (vs CPU)</button>
        <button class="btn" id="btn-2p" style="background: #a855f7; color: white;">2 Player (Local)</button>
      </div>
    </div>
  </div>
  <div style="margin-top: 12px; font-size: 12px; color: #64748b;">
    P1: W / S or Mouse • P2: Up / Down Arrow keys
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const overlay = document.getElementById('overlay');
    const overTitle = document.getElementById('over-title');
    const overDesc = document.getElementById('over-desc');

    let audioCtx = null;
    function beep(freq) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.06);
      } catch (e) {}
    }

    const PADDLE_H = 64;
    const PADDLE_W = 10;
    let p1 = { y: 138, score: 0 };
    let p2 = { y: 138, score: 0 };
    let ball = { x: 260, y: 170, vx: 4, vy: 2, r: 6 };
    let is2Player = false;
    let running = false;
    let keys = {};

    function start(twoPlayer) {
      is2Player = twoPlayer;
      p1.score = 0;
      p2.score = 0;
      p1ScoreEl.textContent = '0';
      p2ScoreEl.textContent = '0';
      resetBall(1);
      running = true;
      overlay.style.display = 'none';
    }

    function resetBall(dir) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.vx = dir * 4.5;
      ball.vy = (Math.random() - 0.5) * 4;
    }

    function update() {
      if (!running) return;

      // P1 movement
      if (keys['KeyW']) p1.y = Math.max(0, p1.y - 5);
      if (keys['KeyS']) p1.y = Math.min(canvas.height - PADDLE_H, p1.y + 5);

      // P2 movement
      if (is2Player) {
        if (keys['ArrowUp']) p2.y = Math.max(0, p2.y - 5);
        if (keys['ArrowDown']) p2.y = Math.min(canvas.height - PADDLE_H, p2.y + 5);
      } else {
        // AI logic
        const target = ball.y - PADDLE_H / 2;
        p2.y += (target - p2.y) * 0.085;
        p2.y = Math.max(0, Math.min(canvas.height - PADDLE_H, p2.y));
      }

      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top/bottom bounce
      if (ball.y - ball.r < 0 || ball.y + ball.r > canvas.height) {
        ball.vy = -ball.vy;
        beep(350);
      }

      // Left paddle collision
      if (ball.x - ball.r <= 20 + PADDLE_W && ball.y >= p1.y && ball.y <= p1.y + PADDLE_H) {
        ball.vx = Math.abs(ball.vx) * 1.05;
        const offset = (ball.y - (p1.y + PADDLE_H / 2)) / (PADDLE_H / 2);
        ball.vy = offset * 5;
        beep(500);
      }

      // Right paddle collision
      if (ball.x + ball.r >= canvas.width - 20 - PADDLE_W && ball.y >= p2.y && ball.y <= p2.y + PADDLE_H) {
        ball.vx = -Math.abs(ball.vx) * 1.05;
        const offset = (ball.y - (p2.y + PADDLE_H / 2)) / (PADDLE_H / 2);
        ball.vy = offset * 5;
        beep(500);
      }

      // Score check
      if (ball.x < 0) {
        p2.score++;
        p2ScoreEl.textContent = p2.score;
        beep(200);
        checkWin();
        resetBall(1);
      } else if (ball.x > canvas.width) {
        p1.score++;
        p1ScoreEl.textContent = p1.score;
        beep(600);
        checkWin();
        resetBall(-1);
      }

      draw();
      requestAnimationFrame(update);
    }

    function checkWin() {
      if (p1.score >= 7 || p2.score >= 7) {
        running = false;
        const winner = p1.score >= 7 ? 'PLAYER 1 WINS!' : (is2Player ? 'PLAYER 2 WINS!' : 'CPU WINS!');
        overTitle.textContent = winner;
        overDesc.textContent = `Final Score: ${p1.score} - ${p2.score}`;
        overlay.style.display = 'flex';
      }
    }

    function draw() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dotted line
      ctx.strokeStyle = '#334155';
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // P1 Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(20, p1.y, PADDLE_W, PADDLE_H);

      // P2 Paddle
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(canvas.width - 20 - PADDLE_W, p2.y, PADDLE_W, PADDLE_H);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      p1.y = Math.max(0, Math.min(canvas.height - PADDLE_H, (e.clientY - rect.top) * scaleY - PADDLE_H / 2));
    });

    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    document.getElementById('btn-1p').onclick = () => { start(false); requestAnimationFrame(update); };
    document.getElementById('btn-2p').onclick = () => { start(true); requestAnimationFrame(update); };

    draw();
  </script>
</body>
</html>
